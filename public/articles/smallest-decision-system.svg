<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="One well-placed decision, repeated consistently across the system">
  <defs>
    <linearGradient id="bg10" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#fffaf3"/>
      <stop offset="100%" stop-color="#f1e7d8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#bg10)"/>

  <text x="60" y="60" fill="#c9342e" font-family="monospace" font-size="11" letter-spacing="3">ONE DECISION · REPEATED</text>
  <text x="60" y="92" fill="#191817" font-family="serif" font-size="28" font-weight="500" letter-spacing="-0.8">Where the system bends.</text>

  <!-- Diagram: one node chosen, then ripple through the system -->
  <g transform="translate(160 200)">
    <!-- Central chosen node -->
    <rect x="350" y="40" width="180" height="80" fill="#c9342e"/>
    <text x="440" y="68" fill="#fffaf2" font-family="serif" font-size="16" font-weight="700" text-anchor="middle">CHOSEN NODE</text>
    <text x="440" y="92" fill="#fffaf2" font-family="monospace" font-size="10" letter-spacing="2" text-anchor="middle">THE ONE DECISION</text>

    <!-- Surrounding system nodes (un-touched) -->
    <g fill="#fffdf6" stroke="#a48961" stroke-width="1">
      <rect x="60" y="20" width="140" height="60"/>
      <rect x="60" y="120" width="140" height="60"/>
      <rect x="680" y="20" width="140" height="60"/>
      <rect x="680" y="120" width="140" height="60"/>
      <rect x="240" y="200" width="140" height="60"/>
      <rect x="500" y="200" width="140" height="60"/>
    </g>

    <g fill="#191817" font-family="serif" font-size="11" text-anchor="middle">
      <text x="130" y="44">imports</text>
      <text x="130" y="62" fill="#716d67" font-size="9">csv · json · xml</text>

      <text x="130" y="144">validates</text>
      <text x="130" y="162" fill="#716d67" font-size="9">shape · range</text>

      <text x="750" y="44">stores</text>
      <text x="750" y="62" fill="#716d67" font-size="9">postgres · sqlite</text>

      <text x="750" y="144">reports</text>
      <text x="750" y="162" fill="#716d67" font-size="9">monthly · weekly</text>

      <text x="310" y="224">exports</text>
      <text x="310" y="242" fill="#716d67" font-size="9">pdf · csv</text>

      <text x="570" y="224">audits</text>
      <text x="570" y="242" fill="#716d67" font-size="9">who · when</text>
    </g>

    <!-- Decision ripple: arrows from chosen node to surrounding nodes -->
    <g stroke="#c9342e" stroke-width="1.4" fill="none" stroke-dasharray="4 3">
      <path d="M 350 80 Q 280 70, 200 50"/>
      <path d="M 350 100 Q 280 130, 200 150"/>
      <path d="M 530 80 Q 600 70, 680 50"/>
      <path d="M 530 100 Q 600 130, 680 150"/>
      <path d="M 420 120 Q 380 180, 310 200"/>
      <path d="M 460 120 Q 500 180, 570 200"/>
    </g>

    <!-- Ripple labels -->
    <g fill="#c9342e" font-family="monospace" font-size="8" letter-spacing="1" font-style="italic">
      <text x="280" y="48">clearer errors</text>
      <text x="280" y="160">fewer rejects</text>
      <text x="600" y="48">consistent IDs</text>
      <text x="600" y="160">clean joins</text>
      <text x="370" y="190">formats match</text>
      <text x="510" y="190">traceable logs</text>
    </g>
  </g>

  <!-- Right column: explanation -->
  <g transform="translate(900 200)">
    <rect x="0" y="0" width="240" height="280" fill="#fffdf6" stroke="#a48961" stroke-width="1"/>
    <text x="20" y="32" fill="#c9342e" font-family="monospace" font-size="11" letter-spacing="2">WHY ONE</text>
    <line x1="20" y1="44" x2="220" y2="44" stroke="#191817" stroke-width="0.5"/>

    <g fill="#191817" font-family="serif" font-size="12">
      <text x="20" y="78">A rewrite hides</text>
      <text x="20" y="96" fill="#716d67" font-size="10" font-style="italic">the question.</text>

      <text x="20" y="128">One decision shows</text>
      <text x="20" y="146" fill="#716d67" font-size="10" font-style="italic">what the system needs.</text>

      <text x="20" y="178">Repeating it builds</text>
      <text x="20" y="196" fill="#716d67" font-size="10" font-style="italic">trust with the team.</text>

      <text x="20" y="228">A small start,</text>
      <text x="20" y="246" fill="#c9342e" font-size="11">consistent outcomes.</text>
    </g>
  </g>

  <!-- Footnote -->
  <text x="60" y="540" fill="#c9342e" font-family="monospace" font-size="11" letter-spacing="2">SMALL START · LARGE TRUST</text>
  <text x="60" y="566" fill="#191817" font-family="serif" font-size="14" font-style="italic">"One well-placed decision, repeated consistently across the system."</text>

  <!-- Corner registration -->
  <g stroke="#c9342e" stroke-width="1" fill="none" opacity="0.5">
    <path d="M 24 24 L 24 60 M 24 24 L 60 24"/>
    <path d="M 1176 24 L 1176 60 M 1176 24 L 1140 24"/>
    <path d="M 24 576 L 24 540 M 24 576 L 60 576"/>
    <path d="M 1176 576 L 1176 540 M 1176 576 L 1140 576"/>
  </g>
</svg>
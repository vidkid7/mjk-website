<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A Tuesday afternoon, a quiet form, the work finished on time">
  <defs>
    <linearGradient id="bg8" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#fffaf3"/>
      <stop offset="100%" stop-color="#f1e7d8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#bg8)"/>

  <text x="60" y="60" fill="#c9342e" font-family="monospace" font-size="11" letter-spacing="3">QUIET INTERFACES · A TUESDAY AFTERNOON</text>
  <text x="60" y="92" fill="#191817" font-family="serif" font-size="28" font-weight="500" letter-spacing="-0.8">The work finished on time.</text>

  <!-- Window with light interface -->
  <g transform="translate(160 160)">
    <rect x="0" y="0" width="600" height="360" rx="8" fill="#fffdf6" stroke="#a48961" stroke-width="1.4"/>

    <!-- Window chrome -->
    <rect x="0" y="0" width="600" height="36" rx="8" fill="#f1e7d8"/>
    <rect x="0" y="20" width="600" height="16" fill="#f1e7d8"/>
    <circle cx="20" cy="18" r="5" fill="#c9342e"/>
    <circle cx="38" cy="18" r="5" fill="#a48961"/>
    <circle cx="56" cy="18" r="5" fill="#a48961" opacity="0.5"/>

    <text x="80" y="22" fill="#191817" font-family="monospace" font-size="11" letter-spacing="2">APPLICATION · QUIET FORM</text>
    <text x="560" y="22" fill="#716d67" font-family="monospace" font-size="10" text-anchor="end">14:32</text>

    <!-- Form heading -->
    <text x="36" y="78" fill="#191817" font-family="serif" font-size="18" font-weight="500">Record a household visit</text>
    <line x1="36" y1="92" x2="564" y2="92" stroke="#a48961" stroke-width="0.4"/>

    <!-- Form fields (quiet) -->
    <g fill="#716d67" font-family="monospace" font-size="9" letter-spacing="1">
      <text x="36" y="116">VISITOR</text>
      <text x="36" y="180">PURPOSE</text>
      <text x="36" y="244">NOTES</text>
    </g>

    <!-- Input fields (clean white with thin borders, no shadows) -->
    <g>
      <rect x="36" y="124" width="528" height="34" fill="none" stroke="#a48961" stroke-width="0.8"/>
      <text x="48" y="146" fill="#191817" font-family="serif" font-size="13">Hari K. — ward 4</text>

      <rect x="36" y="188" width="528" height="34" fill="none" stroke="#a48961" stroke-width="0.8"/>
      <text x="48" y="210" fill="#191817" font-family="serif" font-size="13">Document review · citizenship application</text>

      <rect x="36" y="252" width="528" height="56" fill="none" stroke="#a48961" stroke-width="0.8"/>
      <text x="48" y="274" fill="#191817" font-family="serif" font-size="13">All required documents present.</text>
      <text x="48" y="294" fill="#191817" font-family="serif" font-size="13">Recommending approval.</text>
    </g>

    <!-- Action buttons (single, calm) -->
    <g transform="translate(36 326)">
      <rect x="0" y="0" width="120" height="22" fill="#c9342e"/>
      <text x="60" y="15" fill="#fffaf2" font-family="monospace" font-size="9" letter-spacing="2" text-anchor="middle" font-weight="700">SUBMIT</text>

      <text x="140" y="15" fill="#716d67" font-family="monospace" font-size="9" letter-spacing="1">ESC TO CANCEL · ⌘+ENTER TO SEND</text>
    </g>
  </g>

  <!-- Right column: callout comparison -->
  <g transform="translate(820 160)">
    <rect x="0" y="0" width="280" height="360" fill="#fffdf6" stroke="#a48961" stroke-width="1"/>
    <text x="20" y="32" fill="#c9342e" font-family="monospace" font-size="10" letter-spacing="2">A QUIET FORM</text>
    <line x1="20" y1="44" x2="260" y2="44" stroke="#191817" stroke-width="0.5"/>

    <g fill="#191817" font-family="serif" font-size="12">
      <text x="20" y="76" font-weight="700">One job per screen</text>
      <text x="20" y="94" fill="#716d67" font-size="10" font-style="italic">→ "Record a household visit."</text>

      <text x="20" y="130" font-weight="700">No invented vocabulary</text>
      <text x="20" y="148" fill="#716d67" font-size="10" font-style="italic">→ "Visitor, purpose, notes."</text>

      <text x="20" y="184" font-weight="700">Labels like architecture</text>
      <text x="20" y="202" fill="#716d67" font-size="10" font-style="italic">→ one field, one job, one name</text>

      <text x="20" y="238" font-weight="700">Motion hides nothing</text>
      <text x="20" y="256" fill="#716d67" font-size="10" font-style="italic">→ state is in the field, not the spinner</text>
    </g>

    <line x1="20" y1="280" x2="260" y2="280" stroke="#a48961" stroke-width="0.5"/>

    <text x="20" y="304" fill="#c9342e" font-family="monospace" font-size="9" letter-spacing="1">— restraint is the design</text>
    <text x="20" y="324" fill="#191817" font-family="serif" font-size="11" font-style="italic">A quiet interface is rich where it counts.</text>
    <text x="20" y="342" fill="#191817" font-family="serif" font-size="11" font-style="italic">It refuses noise where the user did not ask.</text>
  </g>

  <!-- Footnote -->
  <text x="60" y="540" fill="#c9342e" font-family="monospace" font-size="11" letter-spacing="2">SHIPPED QUIET · FORM 04 · AUG 12</text>
  <text x="60" y="566" fill="#191817" font-family="serif" font-size="14" font-style="italic">Quiet is not minimal. Quiet is appropriate.</text>

  <!-- Corner registration -->
  <g stroke="#c9342e" stroke-width="1" fill="none" opacity="0.5">
    <path d="M 24 24 L 24 60 M 24 24 L 60 24"/>
    <path d="M 1176 24 L 1176 60 M 1176 24 L 1140 24"/>
    <path d="M 24 576 L 24 540 M 24 576 L 60 576"/>
    <path d="M 1176 576 L 1176 540 M 1176 576 L 1140 576"/>
  </g>
</svg>
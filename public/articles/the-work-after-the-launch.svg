<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="The week after launch: backup windows, on-call rotation, owner notes">
  <defs>
    <linearGradient id="bg2" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#1f1610"/>
      <stop offset="100%" stop-color="#0d0805"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#c9342e" stop-opacity="0.0"/>
      <stop offset="50%" stop-color="#c9342e" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#c9342e" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#bg2)"/>

  <!-- Calendar grid -->
  <g transform="translate(120 100)" opacity="0.85">
    <rect x="0" y="0" width="500" height="380" fill="#fffdf6" stroke="#2a2018" stroke-width="1"/>
    <text x="20" y="36" fill="#191817" font-family="serif" font-size="20" font-weight="700">August 2026</text>
    <line x1="20" y1="56" x2="480" y2="56" stroke="#c9342e" stroke-width="2"/>

    <!-- Day labels -->
    <g fill="#716d67" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle">
      <text x="50" y="78">M</text>
      <text x="115" y="78">T</text>
      <text x="180" y="78">W</text>
      <text x="245" y="78">T</text>
      <text x="310" y="78">F</text>
      <text x="375" y="78">S</text>
      <text x="440" y="78">S</text>
    </g>

    <!-- Calendar days -->
    <g fill="#191817" font-family="monospace" font-size="13" text-anchor="middle">
      <text x="50" y="108">27</text>
      <text x="115" y="108">28</text>
      <text x="180" y="108">29</text>
      <text x="245" y="108">30</text>
      <text x="310" y="108">31</text>
      <text x="375" y="108" fill="#a07f5a">1</text>
      <text x="440" y="108" fill="#a07f5a">2</text>

      <text x="50" y="148">3</text>
      <text x="115" y="148">4</text>
      <text x="180" y="148">5</text>
      <text x="245" y="148">6</text>
      <text x="310" y="148">7</text>
      <text x="375" y="148" fill="#a07f5a">8</text>
      <text x="440" y="148" fill="#a07f5a">9</text>

      <text x="50" y="188" fill="#c9342e" font-weight="700">10</text>
      <text x="115" y="188" fill="#c9342e" font-weight="700">11</text>
      <text x="180" y="188" fill="#c9342e" font-weight="700">12</text>
      <text x="245" y="188">13</text>
      <text x="310" y="188">14</text>
      <text x="375" y="188" fill="#a07f5a">15</text>
      <text x="440" y="148" fill="#a07f5a">16</text>

      <text x="50" y="228">17</text>
      <text x="115" y="228">18</text>
      <text x="180" y="228">19</text>
      <text x="245" y="228">20</text>
      <text x="310" y="228">21</text>
      <text x="375" y="228" fill="#a07f5a">22</text>
      <text x="440" y="228" fill="#a07f5a">23</text>

      <text x="50" y="268">24</text>
      <text x="115" y="268">25</text>
      <text x="180" y="268">26</text>
      <text x="245" y="268">27</text>
      <text x="310" y="268">28</text>
      <text x="375" y="268" fill="#a07f5a">29</text>
      <text x="440" y="268" fill="#a07f5a">30</text>

      <text x="50" y="308">31</text>
    </g>

    <!-- Highlight launch week -->
    <rect x="14" y="158" width="225" height="40" fill="#c9342e" opacity="0.08"/>
    <text x="125" y="340" fill="#c9342e" font-family="monospace" font-size="10" letter-spacing="2" text-anchor="middle">LAUNCH WEEK · 10–12</text>

    <!-- Backup marker -->
    <circle cx="180" cy="183" r="6" fill="#c9342e"/>
    <text x="180" y="186" fill="#fffaf2" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle">B</text>
  </g>

  <!-- Right side: operational notes panel -->
  <g transform="translate(700 110)">
    <rect x="0" y="0" width="380" height="370" fill="#fffdf6" stroke="#2a2018" stroke-width="1"/>
    <text x="20" y="32" fill="#191817" font-family="serif" font-size="14" font-weight="700">OWNERSHIP NOTES</text>
    <line x1="20" y1="46" x2="360" y2="46" stroke="#c9342e" stroke-width="1.2"/>

    <g fill="#191817" font-family="monospace" font-size="10" letter-spacing="1">
      <text x="20" y="76" fill="#716d67">BACKUPS</text>
      <text x="20" y="94">→ Daily 02:00 NPT</text>
      <text x="20" y="110">→ Owner: Ops on-call</text>
      <text x="20" y="126">→ Restore tested weekly</text>

      <text x="20" y="160" fill="#716d67">ACCOUNTS</text>
      <text x="20" y="178">→ Admin: M. Khadka</text>
      <text x="20" y="194">→ Escalation: A. Shrestha</text>

      <text x="20" y="228" fill="#716d67">CHANGE LOG</text>
      <text x="20" y="246">→ Aug 11 · v1.0.2</text>
      <text x="20" y="262">  · fix: receipt PDF</text>
      <text x="20" y="278">→ Aug 12 · v1.0.3</text>
      <text x="20" y="294">  · add: bulk import</text>

      <text x="20" y="328" fill="#c9342e">→ STATUS · ALL GREEN</text>
    </g>
  </g>

  <!-- Waveform across top -->
  <rect x="0" y="0" width="1200" height="6" fill="url(#amber)"/>

  <!-- Corner registration -->
  <g stroke="#c9342e" stroke-width="1" fill="none" opacity="0.5">
    <path d="M 24 24 L 24 60 M 24 24 L 60 24"/>
    <path d="M 1176 24 L 1176 60 M 1176 24 L 1140 24"/>
    <path d="M 24 576 L 24 540 M 24 576 L 60 576"/>
    <path d="M 1176 576 L 1176 540 M 1176 576 L 1140 576"/>
  </g>
</svg>
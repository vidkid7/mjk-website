<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A field visit in Janakpur, drawn on the way out">
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#fffaf3"/>
      <stop offset="100%" stop-color="#f1e7d8"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#fffdf6"/>
      <stop offset="100%" stop-color="#f4ead5"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#c9b89a" stroke-width="0.4" opacity="0.4"/>
    </pattern>
    <linearGradient id="redfade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#c9342e" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#c9342e" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#bg)"/>
  <rect width="1200" height="600" fill="url(#grid)"/>

  <!-- Distant horizon line -->
  <line x1="0" y1="380" x2="1200" y2="380" stroke="#bfa888" stroke-width="1" opacity="0.6"/>

  <!-- Background buildings — small municipal office silhouette -->
  <g opacity="0.35" fill="#a07f5a">
    <rect x="80" y="280" width="120" height="100"/>
    <rect x="220" y="260" width="80" height="120"/>
    <rect x="320" y="290" width="100" height="90"/>
    <polygon points="200,260 220,240 240,260"/>
    <polygon points="420,290 440,270 460,290"/>
  </g>

  <!-- Foreground desk surface -->
  <rect x="0" y="450" width="1200" height="150" fill="#d8c39e" opacity="0.5"/>

  <!-- Paper register on desk -->
  <g transform="translate(160 420)">
    <rect x="0" y="0" width="320" height="180" fill="url(#paper)" stroke="#a48961" stroke-width="1.2"/>
    <!-- Lines on paper -->
    <g stroke="#c9342e" stroke-width="0.8" opacity="0.5">
      <line x1="20" y1="40" x2="300" y2="40"/>
      <line x1="20" y1="70" x2="280" y2="70"/>
      <line x1="20" y1="100" x2="290" y2="100"/>
      <line x1="20" y1="130" x2="270" y2="130"/>
      <line x1="20" y1="160" x2="280" y2="160"/>
    </g>
    <!-- Column headers -->
    <g fill="#191817" font-family="serif" font-size="11" font-weight="600">
      <text x="20" y="28">नाम / Name</text>
      <text x="180" y="28">मिति / Date</text>
      <text x="270" y="28">Status</text>
    </g>
    <!-- Sample entries -->
    <g fill="#716d67" font-family="monospace" font-size="9">
      <text x="20" y="56">Hari K.</text>
      <text x="20" y="86">Sita D.</text>
      <text x="20" y="116">Ram P.</text>
      <text x="20" y="146">Geeta S.</text>
    </g>
    <!-- Hand-written stamp -->
    <g transform="translate(220 100) rotate(-8)">
      <rect x="-20" y="-12" width="80" height="22" fill="none" stroke="#c9342e" stroke-width="1.4" opacity="0.7"/>
      <text x="-14" y="4" fill="#c9342e" font-family="serif" font-size="9" font-weight="700" letter-spacing="2" opacity="0.85">APPROVED</text>
    </g>
  </g>

  <!-- Pen -->
  <g transform="translate(490 510) rotate(15)">
    <rect x="0" y="0" width="80" height="6" fill="#2a2018" rx="1"/>
    <rect x="78" y="-1" width="8" height="8" fill="#c9342e"/>
    <circle cx="2" cy="3" r="1.5" fill="#716d67"/>
  </g>

  <!-- Spreadsheet on phone -->
  <g transform="translate(620 350)">
    <rect x="0" y="0" width="180" height="280" rx="14" fill="#191817" stroke="#2a2018" stroke-width="2"/>
    <rect x="10" y="10" width="160" height="260" fill="#fffdf6"/>
    <!-- Phone screen header -->
    <rect x="10" y="10" width="160" height="24" fill="#c9342e"/>
    <text x="80" y="26" fill="#fffaf2" font-family="monospace" font-size="9" text-anchor="middle">FIELD DATA</text>
    <!-- Rows of data -->
    <g stroke="#a48961" stroke-width="0.5" fill="#716d67" font-family="monospace" font-size="8">
      <rect x="14" y="40" width="152" height="20" fill="none"/>
      <text x="18" y="54">1  Hari K.    Aug 10  ✓</text>
      <rect x="14" y="62" width="152" height="20" fill="none"/>
      <text x="18" y="76">2  Sita D.    Aug 10  ✓</text>
      <rect x="14" y="84" width="152" height="20" fill="none"/>
      <text x="18" y="98">3  Ram P.     Aug 11  ⏳</text>
      <rect x="14" y="106" width="152" height="20" fill="none"/>
      <text x="18" y="120">4  Geeta S.   Aug 11  ✓</text>
      <rect x="14" y="128" width="152" height="20" fill="none"/>
      <text x="18" y="142">5  Hari K.    Aug 12  ⏳</text>
      <rect x="14" y="150" width="152" height="20" fill="none"/>
      <text x="18" y="164">6  Sita D.    Aug 12  ✓</text>
    </g>
    <!-- Bottom summary bar -->
    <rect x="14" y="190" width="152" height="76" fill="#faf2e3" stroke="#a48961" stroke-width="0.4"/>
    <text x="80" y="206" fill="#c9342e" font-family="monospace" font-size="8" font-weight="700" text-anchor="middle">SYNCED · 06/11</text>
    <text x="80" y="222" fill="#716d67" font-family="monospace" font-size="7" text-anchor="middle">OFFLINE CAPABLE</text>
    <!-- Home indicator -->
    <rect x="76" y="254" width="28" height="3" rx="1.5" fill="#a48961"/>
  </g>

  <!-- Signature -->
  <g transform="translate(900 460)">
    <text x="0" y="0" fill="#716d67" font-family="monospace" font-size="10" letter-spacing="3" opacity="0.7">— DRAFTED IN FIELD —</text>
    <line x1="0" y1="10" x2="240" y2="10" stroke="#c9342e" stroke-width="0.8" opacity="0.5"/>
    <text x="0" y="28" fill="#191817" font-family="serif" font-size="14" font-style="italic">Mukesh Khadka</text>
    <text x="0" y="44" fill="#716d67" font-family="monospace" font-size="8" letter-spacing="2">JANAKPUR · NEPAL · 08·10·26</text>
  </g>

  <!-- Corner registration -->
  <g stroke="#c9342e" stroke-width="1" fill="none" opacity="0.5">
    <path d="M 24 24 L 24 60 M 24 24 L 60 24"/>
    <path d="M 1176 24 L 1176 60 M 1176 24 L 1140 24"/>
    <path d="M 24 576 L 24 540 M 24 576 L 60 576"/>
    <path d="M 1176 576 L 1176 540 M 1176 576 L 1140 576"/>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A paper register kept by the team who runs the workflow">
  <defs>
    <linearGradient id="bg6" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#fffaf3"/>
      <stop offset="100%" stop-color="#f1e7d8"/>
    </linearGradient>
    <linearGradient id="paper6" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#fffdf6"/>
      <stop offset="100%" stop-color="#f4ead5"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#bg6)"/>

  <text x="60" y="60" fill="#c9342e" font-family="monospace" font-size="11" letter-spacing="3">SLOW WORKFLOW · BEFORE THE FIRST SCREEN</text>
  <text x="60" y="92" fill="#191817" font-family="serif" font-size="28" font-weight="500" letter-spacing="-0.8">A paper register kept by the team.</text>

  <!-- Desk surface -->
  <rect x="0" y="450" width="1200" height="150" fill="#d8c39e" opacity="0.45"/>

  <!-- The paper register -->
  <g transform="translate(160 200)">
    <!-- Stack of paper -->
    <rect x="20" y="20" width="380" height="280" fill="#fffdf6" stroke="#a48961" stroke-width="0.8" opacity="0.4"/>
    <rect x="10" y="10" width="380" height="280" fill="#fffdf6" stroke="#a48961" stroke-width="0.8" opacity="0.6"/>
    <!-- Top sheet -->
    <rect x="0" y="0" width="380" height="280" fill="url(#paper6)" stroke="#a48961" stroke-width="1.4"/>

    <!-- Title -->
    <text x="190" y="30" fill="#191817" font-family="serif" font-size="14" font-weight="700" text-anchor="middle">FIELD REGISTER · २०८३</text>
    <line x1="20" y1="44" x2="360" y2="44" stroke="#c9342e" stroke-width="1.2"/>

    <!-- Column headers -->
    <g fill="#716d67" font-family="monospace" font-size="9" letter-spacing="1">
      <text x="20" y="62">S.N.</text>
      <text x="60" y="62">NAME</text>
      <text x="160" y="62">DATE</text>
      <text x="220" y="62">PURPOSE</text>
      <text x="310" y="62">✓</text>
    </g>
    <line x1="14" y1="70" x2="366" y2="70" stroke="#a48961" stroke-width="0.5"/>

    <!-- Rows -->
    <g fill="#191817" font-family="serif" font-size="10">
      <text x="20" y="88">01</text>
      <text x="60" y="88">Hari K.</text>
      <text x="160" y="88">05/12</text>
      <text x="220" y="88">renewal</text>
      <text x="310" y="88">×</text>

      <text x="20" y="106">02</text>
      <text x="60" y="106">Sita D.</text>
      <text x="160" y="106">05/12</text>
      <text x="220" y="106">inquiry</text>
      <text x="310" y="106">×</text>

      <text x="20" y="124">03</text>
      <text x="60" y="124">Ram P.</text>
      <text x="160" y="124">05/14</text>
      <text x="220" y="124">payment</text>
      <text x="310" y="124">×</text>

      <text x="20" y="142">04</text>
      <text x="60" y="142">Geeta S.</text>
      <text x="160" y="142">05/14</text>
      <text x="220" y="142">renewal</text>
      <text x="310" y="142">×</text>

      <text x="20" y="160">05</text>
      <text x="60" y="160">Hari K.</text>
      <text x="160" y="160">05/16</text>
      <text x="220" y="160">transfer</text>
      <text x="310" y="160">×</text>

      <text x="20" y="178">06</text>
      <text x="60" y="178">Sita D.</text>
      <text x="160" y="178">05/18</text>
      <text x="220" y="178">complaint</text>
      <text x="310" y="178">×</text>
    </g>

    <line x1="14" y1="190" x2="366" y2="190" stroke="#a48961" stroke-width="0.5"/>

    <!-- Footer summary -->
    <g fill="#716d67" font-family="monospace" font-size="9">
      <text x="20" y="208">Total: 06 entries</text>
      <text x="20" y="222">Avg: 4 per week</text>
    </g>
    <text x="20" y="252" fill="#191817" font-family="serif" font-size="10" font-style="italic">— kept by Sita D., on file since 2019</text>

    <!-- Stamp on top corner -->
    <g transform="translate(280 32) rotate(-6)">
      <rect x="-20" y="-12" width="80" height="22" fill="none" stroke="#c9342e" stroke-width="1.4" opacity="0.85"/>
      <text x="-12" y="4" fill="#c9342e" font-family="serif" font-size="9" font-weight="700" letter-spacing="2" opacity="0.95">ON FILE</text>
    </g>
  </g>

  <!-- Right side: mapping annotations -->
  <g transform="translate(640 160)">
    <rect x="0" y="0" width="400" height="320" fill="#fffdf6" stroke="#a48961" stroke-width="1"/>
    <text x="20" y="32" fill="#c9342e" font-family="monospace" font-size="11" letter-spacing="2">THE SHAPE OF THE WORK</text>
    <line x1="20" y1="44" x2="380" y2="44" stroke="#191817" stroke-width="0.5"/>

    <!-- Annotation arrows pointing at register -->
    <g stroke="#c9342e" stroke-width="1" fill="none">
      <path d="M 200 90 Q 100 90, 30 130"/>
      <path d="M 220 150 Q 100 170, 30 200"/>
      <path d="M 200 220 Q 100 240, 30 280"/>
    </g>
    <polygon points="30,130 38,124 38,136" fill="#c9342e"/>
    <polygon points="30,200 38,194 38,206" fill="#c9342e"/>
    <polygon points="30,280 38,274 38,286" fill="#c9342e"/>

    <g fill="#191817" font-family="serif" font-size="12">
      <text x="240" y="86" font-weight="700">A small dependable piece</text>
      <text x="240" y="106" fill="#716d67" font-style="italic">→ carry name + date into the form first</text>

      <text x="240" y="148" font-weight="700">Walk the workflow</text>
      <text x="240" y="168" fill="#716d67" font-style="italic">→ sit with the team for one full Tuesday</text>

      <text x="240" y="220" font-weight="700">Reads like the workflow it replaced</text>
      <text x="240" y="240" fill="#716d67" font-style="italic">→ no new vocabulary for staff to learn</text>

      <text x="240" y="290" fill="#c9342e" font-style="italic">— small start, large trust</text>
    </g>
  </g>

  <!-- Footnote -->
  <text x="60" y="540" fill="#191817" font-family="serif" font-size="14" font-style="italic">Before the first screen, see the work on paper.</text>
  <text x="60" y="566" fill="#716d67" font-family="monospace" font-size="10" letter-spacing="2">MAPPED · KATHMANDU · MAY 2026</text>

  <!-- Corner registration -->
  <g stroke="#c9342e" stroke-width="1" fill="none" opacity="0.5">
    <path d="M 24 24 L 24 60 M 24 24 L 60 24"/>
    <path d="M 1176 24 L 1176 60 M 1176 24 L 1140 24"/>
    <path d="M 24 576 L 24 540 M 24 576 L 60 576"/>
    <path d="M 1176 576 L 1176 540 M 1176 576 L 1140 576"/>
  </g>
</svg>
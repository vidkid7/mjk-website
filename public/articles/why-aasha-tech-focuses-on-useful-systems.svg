<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A workspace where routine records carry the day">
  <defs>
    <linearGradient id="bg4" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#fffaf3"/>
      <stop offset="100%" stop-color="#f1e7d8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#bg4)"/>

  <!-- Grid paper background -->
  <pattern id="grid4" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#c9b89a" stroke-width="0.3" opacity="0.5"/>
  </pattern>
  <rect width="1200" height="600" fill="url(#grid4)"/>

  <!-- Top kicker -->
  <text x="60" y="60" fill="#c9342e" font-family="monospace" font-size="11" letter-spacing="3">AASHA TECH · SYSTEMS THAT CARRY THE DAY</text>

  <!-- Decorative diagram: registry → form → log → record → dashboard -->
  <g transform="translate(60 130)">
    <!-- Stage 1: Paper register -->
    <g transform="translate(0 0)">
      <rect x="0" y="0" width="180" height="220" fill="#fffdf6" stroke="#a48961" stroke-width="1.2"/>
      <text x="90" y="22" fill="#191817" font-family="serif" font-size="11" font-weight="700" text-anchor="middle">PAPER REGISTER</text>
      <line x1="14" y1="32" x2="166" y2="32" stroke="#c9342e" stroke-width="0.8"/>
      <g stroke="#716d67" stroke-width="0.5">
        <line x1="14" y1="50" x2="166" y2="50"/>
        <line x1="14" y1="70" x2="166" y2="70"/>
        <line x1="14" y1="90" x2="166" y2="90"/>
        <line x1="14" y1="110" x2="166" y2="110"/>
        <line x1="14" y1="130" x2="166" y2="130"/>
        <line x1="14" y1="150" x2="166" y2="150"/>
        <line x1="14" y1="170" x2="166" y2="170"/>
        <line x1="14" y1="190" x2="166" y2="190"/>
      </g>
      <g fill="#191817" font-family="serif" font-size="9">
        <text x="14" y="58">नाम / Name</text>
        <text x="14" y="78">मिति / Date</text>
        <text x="14" y="98">विषय / Subject</text>
        <text x="14" y="118">रकम / Amount</text>
        <text x="14" y="138">हस्ताक्षर / Sign</text>
        <text x="14" y="158">—</text>
        <text x="14" y="178">—</text>
      </g>
      <text x="90" y="208" fill="#716d67" font-family="monospace" font-size="8" text-anchor="middle">SOURCE OF TRUTH</text>
    </g>

    <!-- Arrow 1 -->
    <g transform="translate(190 110)">
      <line x1="0" y1="0" x2="40" y2="0" stroke="#c9342e" stroke-width="1.4"/>
      <polygon points="40,-5 50,0 40,5" fill="#c9342e"/>
      <text x="25" y="-8" fill="#c9342e" font-family="monospace" font-size="8" text-anchor="middle">SCAN</text>
    </g>

    <!-- Stage 2: Digital form -->
    <g transform="translate(252 0)">
      <rect x="0" y="0" width="180" height="220" fill="#191817" stroke="#2a2018" stroke-width="1.2" rx="2"/>
      <rect x="6" y="6" width="168" height="208" fill="#fffdf6" rx="1"/>
      <rect x="14" y="14" width="152" height="20" fill="#c9342e"/>
      <text x="90" y="28" fill="#fffaf2" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle">DATA ENTRY</text>
      <g fill="#191817" font-family="monospace" font-size="8">
        <rect x="14" y="44" width="152" height="18" fill="none" stroke="#a48961"/>
        <text x="20" y="56">Hari K.</text>
        <rect x="14" y="66" width="152" height="18" fill="none" stroke="#a48961"/>
        <text x="20" y="78">Aug 10, 2026</text>
        <rect x="14" y="88" width="152" height="18" fill="none" stroke="#a48961"/>
        <text x="20" y="100">Application</text>
        <rect x="14" y="110" width="152" height="18" fill="none" stroke="#a48961"/>
        <text x="20" y="122">NPR 12,500</text>
        <rect x="14" y="132" width="152" height="18" fill="none" stroke="#a48961"/>
        <text x="20" y="144">[signature]</text>
        <circle cx="148" cy="180" r="8" fill="#c9342e"/>
        <text x="148" y="183" fill="#fffaf2" font-family="monospace" font-size="9" text-anchor="middle">✓</text>
      </g>
      <text x="90" y="208" fill="#716d67" font-family="monospace" font-size="8" text-anchor="middle">DIGITAL FORM</text>
    </g>

    <!-- Arrow 2 -->
    <g transform="translate(442 110)">
      <line x1="0" y1="0" x2="40" y2="0" stroke="#c9342e" stroke-width="1.4"/>
      <polygon points="40,-5 50,0 40,5" fill="#c9342e"/>
      <text x="25" y="-8" fill="#c9342e" font-family="monospace" font-size="8" text-anchor="middle">SAVE</text>
    </g>

    <!-- Stage 3: Workflow log -->
    <g transform="translate(504 0)">
      <rect x="0" y="0" width="180" height="220" fill="#fffdf6" stroke="#a48961" stroke-width="1.2"/>
      <text x="90" y="22" fill="#191817" font-family="serif" font-size="11" font-weight="700" text-anchor="middle">LOG · LEDGER</text>
      <line x1="14" y1="32" x2="166" y2="32" stroke="#c9342e" stroke-width="0.8"/>
      <g fill="#191817" font-family="monospace" font-size="8">
        <text x="14" y="50" fill="#716d67">10:14</text>
        <text x="58" y="50">created</text>
        <text x="14" y="68" fill="#716d67">10:14</text>
        <text x="58" y="68">signed</text>
        <text x="14" y="86" fill="#716d67">10:15</text>
        <text x="58" y="86">approved</text>
        <text x="14" y="104" fill="#716d67">10:16</text>
        <text x="58" y="104">filed</text>
        <text x="14" y="122" fill="#716d67">14:02</text>
        <text x="58" y="122">queried</text>
        <text x="14" y="140" fill="#716d67">14:03</text>
        <text x="58" y="140">resolved</text>
      </g>
      <g stroke="#a48961" stroke-width="0.4" fill="none">
        <line x1="50" y1="46" x2="50" y2="148"/>
      </g>
      <text x="90" y="208" fill="#716d67" font-family="monospace" font-size="8" text-anchor="middle">AUDIT TRAIL</text>
    </g>

    <!-- Arrow 3 -->
    <g transform="translate(694 110)">
      <line x1="0" y1="0" x2="40" y2="0" stroke="#c9342e" stroke-width="1.4"/>
      <polygon points="40,-5 50,0 40,5" fill="#c9342e"/>
      <text x="25" y="-8" fill="#c9342e" font-family="monospace" font-size="8" text-anchor="middle">SYNC</text>
    </g>

    <!-- Stage 4: Dashboard -->
    <g transform="translate(756 0)">
      <rect x="0" y="0" width="180" height="220" fill="#fffdf6" stroke="#a48961" stroke-width="1.2"/>
      <text x="90" y="22" fill="#191817" font-family="serif" font-size="11" font-weight="700" text-anchor="middle">DASHBOARD</text>
      <line x1="14" y1="32" x2="166" y2="32" stroke="#c9342e" stroke-width="0.8"/>
      <g>
        <rect x="14" y="44" width="152" height="20" fill="#c9342e" opacity="0.1"/>
        <text x="20" y="58" fill="#c9342e" font-family="monospace" font-size="9" font-weight="700">06</text>
        <text x="40" y="58" fill="#191817" font-family="monospace" font-size="8">records today</text>
        <rect x="14" y="68" width="152" height="20" fill="#a48961" opacity="0.15"/>
        <text x="20" y="82" fill="#191817" font-family="monospace" font-size="9" font-weight="700">04</text>
        <text x="40" y="82" fill="#191817" font-family="monospace" font-size="8">pending review</text>
        <rect x="14" y="92" width="152" height="20" fill="#a48961" opacity="0.05"/>
        <text x="20" y="106" fill="#191817" font-family="monospace" font-size="9" font-weight="700">02</text>
        <text x="40" y="106" fill="#191817" font-family="monospace" font-size="8">flagged</text>
      </g>
      <text x="90" y="146" fill="#716d67" font-family="monospace" font-size="8" text-anchor="middle">TRENDS · LAST 7 DAYS</text>
      <!-- Mini sparkline -->
      <g stroke="#c9342e" stroke-width="1.4" fill="none" stroke-linecap="round">
        <path d="M 24 200 L 50 188 L 76 192 L 102 176 L 128 180 L 154 162 L 180 168"/>
      </g>
      <text x="90" y="208" fill="#716d67" font-family="monospace" font-size="8" text-anchor="middle">REPORTING</text>
    </g>
  </g>

  <!-- Footnote -->
  <g transform="translate(60 480)">
    <line x1="0" y1="0" x2="1080" y2="0" stroke="#c9342e" stroke-width="0.6" opacity="0.5"/>
    <text x="0" y="20" fill="#191817" font-family="serif" font-size="14" font-style="italic">Each stage adds a small dependable piece.</text>
    <text x="0" y="42" fill="#716d67" font-family="monospace" font-size="10" letter-spacing="2">PAPER → FORM → LOG → RECORD → REPORT</text>
  </g>

  <!-- Corner registration -->
  <g stroke="#c9342e" stroke-width="1" fill="none" opacity="0.5">
    <path d="M 24 24 L 24 60 M 24 24 L 60 24"/>
    <path d="M 1176 24 L 1176 60 M 1176 24 L 1140 24"/>
    <path d="M 24 576 L 24 540 M 24 576 L 60 576"/>
    <path d="M 1176 576 L 1176 540 M 1176 576 L 1140 576"/>
  </g>
</svg>